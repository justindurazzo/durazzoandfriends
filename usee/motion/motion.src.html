<title>What Do U.S.E.E.?</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a 1920x1080 stage scaled to fit. One idea on screen at a time, speaker chip and caption along the bottom,
   lens tracker top right. Every entrance is a focus pull: blurry to sharp, like reading the next line of an eye chart. */
@font-face{font-family:"Bricolage V";src:url(__F_BRIC__) format("woff2");font-weight:200 800;font-stretch:75% 100%}
@font-face{font-family:"Atkinson L";font-weight:400;src:url(__F_ATK4__) format("woff2")}
@font-face{font-family:"Atkinson L";font-weight:700;src:url(__F_ATK7__) format("woff2")}
@font-face{font-family:"Atkinson L";font-weight:400;font-style:italic;src:url(__F_ATKI__) format("woff2")}
@font-face{font-family:"Atkinson Mono L";font-weight:500;src:url(__F_MONO__) format("woff2")}
:root{
  --night:#0F1E33; --night-2:#1B2E4A; --paper:#F3F5F7; --paper-2:#E3E8EE; --ink:#0F1E33; --ink-dim:#566479; --on-night-dim:#9AA8BC;
  --u:#3E84E6; --s:#2E9E63; --e1:#E8922A; --e2:#9A62E8; --act:#E5533D;
  --display:"Bricolage V","Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --body:"Atkinson L","Atkinson Hyperlegible",Verdana,sans-serif;
  --mono:"Atkinson Mono L","Atkinson Hyperlegible Mono",ui-monospace,Menlo,monospace;
  --page:#0A1424; --page-fg:#F3F5F7;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--page);color:var(--page-fg);font-family:var(--body);margin:0;overflow:hidden;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.frame{position:relative;width:100%;max-width:min(100%,calc((100vh - 110px)*16/9));aspect-ratio:16/9;overflow:hidden;border-radius:8px}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:var(--paper)}
.bg{position:absolute;inset:0}
#tracker{position:absolute;right:110px;top:64px;display:flex;gap:14px;z-index:5;font-family:var(--display);font-weight:800;font-size:30px}
#tracker span{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:3px solid currentColor;transition:none}
#seclab{position:absolute;left:110px;top:76px;font-family:var(--mono);font-size:22px;letter-spacing:.14em;z-index:5}
#foot{position:absolute;left:110px;right:110px;bottom:52px;display:flex;flex-direction:column;gap:14px;z-index:5}
#who{display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:22px;letter-spacing:.1em}
#who i{display:block;width:16px;height:16px;border-radius:50%}
#cap{font-family:var(--body);font-size:34px;line-height:1.3;max-width:1560px;min-height:88px}
#prog{position:absolute;left:0;bottom:0;height:6px;z-index:6}
.beat{position:absolute;left:110px;right:110px;top:150px;bottom:230px;display:flex;flex-direction:column;justify-content:center;gap:36px}
.d{font-family:var(--display);font-weight:800;letter-spacing:-.025em;line-height:.95;margin:0;text-wrap:balance;font-stretch:100%}
.ln{display:block}
.m{font-family:var(--mono);letter-spacing:.1em}
.card{border-radius:24px;padding:40px 44px;box-sizing:border-box}
.row{display:flex;gap:32px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:32px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px}
.controls{display:flex;align-items:center;gap:14px;width:100%;max-width:min(100%,calc((100vh - 110px)*16/9));font-family:var(--mono);font-size:13px}
.controls button{font:inherit;font-size:14px;min-width:88px;min-height:44px;border-radius:22px;border:1px solid var(--on-night-dim);background:transparent;color:var(--page-fg);cursor:pointer}
.controls button:focus-visible,.controls input:focus-visible{outline:2px solid var(--e1);outline-offset:2px}
.controls input{flex:1;min-width:0;accent-color:var(--e1)}
.controls output{font-variant-numeric:tabular-nums;color:var(--on-night-dim);white-space:nowrap}
body.render{padding:0;display:block}
body.render .frame{max-width:none;width:1920px;height:1080px;border-radius:0}
body.render .controls{display:none}
@media (prefers-reduced-motion: reduce){ .focus{filter:none!important} }
</style>

<script>
const TL = __TIMELINE__;
const TOTAL = TL.total;
const C = {night:'#0F1E33',night2:'#1B2E4A',paper:'#F3F5F7',paper2:'#E3E8EE',ink:'#0F1E33',dim:'#566479',ndim:'#9AA8BC',u:'#3E84E6',s:'#2E9E63',e1:'#E8922A',e2:'#9A62E8',act:'#E5533D'};
const LENS = [{l:'U',w:'Understanding',c:C.u,q:'Do I have the information?'},{l:'S',w:'Safety',c:C.s,q:'Is this safe?'},{l:'E',w:'Efficiency',c:C.e1,q:'Is this the best use of time, resources, and people?'},{l:'E',w:'Engagement',c:C.e2,q:'Will this strengthen my team?'}];
// Which lens each section belongs to (-1 none, 4 all).
const SEC_LENS = {'00':-1,'01':-1,'02':0,'03':1,'04':2,'05':3,'06':4,'07':4};
const SPK = {JAMES:{n:'JAMES DURAZZO',r:'PRESENTER',c:C.u},SAFAA:{n:'CHEF SAFAA',r:'COOK AMBASSADOR',c:C.act},COOK:{n:'A COOK',r:'IN THE ROOM',c:C.s},'COOK 2':{n:'ANOTHER COOK',r:'IN THE ROOM',c:C.e2},NARRATOR:{n:'IN THE ROOM',r:'',c:C.dim}};

// Beats: what fills the screen. `at` names the line that triggers it; dark:true puts it on night.
const BEATS = [
 {at:'Cooks arrive, sign in', k:'title', dark:1},
 {at:'Good morning, everybody', k:'people'},
 {at:'Today\'s session comes from a framework', k:'acronym', dark:1},
 {at:'A few ground rules', k:'list', head:'Ground rules', items:['Have fun.','Listen to understand.','Share what you know.','Phones on vibrate.','Say it to the whole room.']},
 {at:'So here\'s the question for today', k:'big', text:'How can I use U.S.E.E.\nto lead my kitchen better,\nevery single day?', size:110},
 {at:'Every day, things come up', k:'lenses'},
 {at:'By the end of today', k:'motto', dark:1},
 {at:'Section one. Understanding', k:'section', lens:0, dark:1},
 {at:'Understanding means knowing your team', k:'big', text:'Knowing what\'s happening.\nAnd what you can do about it.', size:110, color:C.u},
 {at:'Because you can\'t spend your whole day', k:'buckets'},
 {at:'The room splits into three groups', k:'groups'},
 {at:'Our milk chest broke', k:'piles'},
 {at:'that actually happened in my kitchen', k:'story', who:'CHEF SAFAA', text:'If it\'s already out of range, it doesn\'t matter where you move it.'},
 {at:'And that\'s the whole point', k:'cost'},
 {at:'Understanding doesn\'t mean waiting', k:'big', text:'Respond to the real problem.\nNot the first one you notice.', size:110, color:C.u},
 {at:'I had a worker who was slow', k:'story', who:'CHEF SAFAA', text:'The slicer was dull, and he was afraid to say anything. One question changed everything.'},
 {at:'Let\'s practice. Four scenarios', k:'four'},
 {at:'That\'s right. Good leaders try to understand', k:'big', text:'Understand everything.\nBut when safety\'s on the line,\nact first.', size:110, color:C.act},
 {at:'Section two. Safety', k:'section', lens:1, dark:1},
 {at:'Understanding is where we start', k:'big', text:'When there\'s a hazard,\nsafety comes first.', size:130, color:C.s},
 {at:'Safety means protecting', k:'three'},
 {at:'For physical safety, every morning', k:'story', who:'CHEF SAFAA', text:'Every morning, I walk the floor. We fix it before anybody gets hurt.', tag:'PHYSICAL'},
 {at:'For emotional safety', k:'story', who:'A COOK', text:'I don\'t yell in front of everybody. I pull them aside and we talk about it.', tag:'EMOTIONAL'},
 {at:'And procedural. Filling out', k:'story', who:'A COOK', text:'Fill out the temp log every single day. Not on Friday for the whole week.', tag:'PROCEDURAL'},
 {at:'Next, the safety scavenger hunt', k:'hunt'},
 {at:'Look at how many there are', k:'big', text:'What has to be fixed right now?\nWhat\'s out of our control?', size:100},
 {at:'Exactly. That\'s the Understanding lens', k:'why'},
 {at:'After a short coffee break', k:'section', lens:2, dark:1},
 {at:'We spent the morning finding hazards', k:'big', text:'Most safety problems start\nwhen something in the\noperation isn\'t working.', size:100, color:C.e1},
 {at:'So, efficiency', k:'effdef'},
 {at:'We look at it in four areas', k:'wheel'},
 {at:'I\'ll go first. For me, it\'s time', k:'barrier', who:'CHEF SAFAA', area:'TIME', bar:'Deliveries land in the middle of prep.', act:'Prep the afternoon before on delivery days.'},
 {at:'Mine\'s people', k:'barrier', who:'A COOK', area:'PEOPLE', bar:'Nobody is cross trained on the dish machine.', act:'Train two more people this month.'},
 {at:'That\'s it. Efficiency isn\'t more work', k:'big', text:'Efficiency isn\'t more work.\nIt\'s making it easier\nto do the right work.', size:110, color:C.e1},
 {at:'Lunch. Somebody else cooks', k:'section', lens:3, dark:1},
 {at:'Okay, brain teaser', k:'teaser'},
 {at:'Give yourselves a hand', k:'big', text:'The fun wasn\'t the riddles.\nIt was that everybody got to play.', size:100, color:C.e2},
 {at:'Engagement means building a kitchen', k:'big', text:'Kitchens succeed\nbecause of people.', size:150, color:C.e2},
 {at:'So here\'s the activity', k:'big', text:'One idea to get your staff, students,\nor school more involved\nin breakfast or lunch.', size:90},
 {at:'My idea is a monthly student taste test', k:'story', who:'CHEF SAFAA', text:'A monthly student taste test. The kids vote on a new recipe before it goes on the menu.'},
 {at:'Safaa, I love that', k:'affirm'},
 {at:'That\'s engagement in action', k:'ownership'},
 {at:'Two more tools. Recognition', k:'tools'},
 {at:'My first manager thanked me', k:'story', who:'CHEF SAFAA', text:'My first manager thanked me by name, in front of the whole team. I still remember it.'},
 {at:'Most of the time, appreciation', k:'big', text:'Appreciation isn\'t about awards.\nIt\'s about being seen.', size:110, color:C.e2},
 {at:'And inclusion', k:'ask'},
 {at:'The final section', k:'section', lens:4, dark:1},
 {at:'So that\'s all four', k:'recap'},
 {at:'So next time you\'re facing a decision', k:'checklist'},
 {at:'Here\'s how this keeps going', k:'timeline'},
 {at:'SMART means Specific', k:'smart'},
 {at:'For the next fifteen minutes', k:'big', text:'Every goal, specific\nto every kitchen.', size:140},

];

const norm = s => s.replace(/[‘’]/g,"'").toLowerCase();
const LINES = TL.lines;
const ALLB = [];
let from = 0;
BEATS.forEach(b => {
  const i = LINES.findIndex((l,j) => j>=from && norm(l.text).includes(norm(b.at)));
  if (i<0) { console.warn('beat not found', b.at); return; }
  from = i; ALLB.push({...b, t0: LINES[i].t});
});
ALLB.forEach((b,i) => b.t1 = i+1<ALLB.length ? ALLB[i+1].t0 : TOTAL);

const $ = id => document.getElementById(id);
const clamp = (v,a=0,b=1) => Math.max(a,Math.min(b,v));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
const fmt = s => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
// The signature move: blurry to sharp.
function focus(el, x, rise=24){ const e=ease(x); el.style.opacity=clamp(x*2.2); el.style.filter=`blur(${(1-e)*16}px)`; el.style.transform=`translateY(${(1-e)*rise}px)`; }
function stagger(root, sel, lt, gap=.18, dur=.8, start=0){ root.querySelectorAll(sel).forEach((n,i)=>focus(n,(lt-start-i*gap)/dur)); }
function bigText(text,size,col,fg){ const ls=text.split('\n'); return `<h2 class="d" style="font-size:${size}px">${ls.map((l,i)=>`<span class="ln f" style="color:${i===ls.length-1&&col?col:fg}">${esc(l)}</span>`).join('')}</h2>`; }
function glasses(w, glint=1){ return `<svg width="${w}" height="${w*.36}" viewBox="0 0 500 180" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="14"><circle cx="135" cy="95" r="72"/><circle cx="365" cy="95" r="72"/><path d="M207 90 Q250 62 293 90"/><path d="M63 88 L20 70"/><path d="M437 88 L480 70"/></g>${glint?`<g stroke-width="8" stroke-linecap="round"><path d="M100 120 L150 70" stroke="${C.u}"/><path d="M120 128 L170 78" stroke="${C.e1}"/><path d="M330 120 L380 70" stroke="${C.s}"/><path d="M350 128 L400 78" stroke="${C.e2}"/></g>`:''}</svg>`; }

const K = {
 title:{ b:(b,th)=>`<div style="display:grid;grid-template-columns:minmax(0,1fr) 760px;gap:80px;align-items:center">
   <div style="display:flex;flex-direction:column;gap:30px">
     <div class="f" style="color:${C.paper}">${glasses(380)}</div>
     <h1 class="d f" style="font-size:150px;color:${C.paper}">What Do<br>U.S.E.E.?</h1>
     <p class="f m" style="margin:0;font-size:24px;color:${C.ndim}">KITCHEN LEADERSHIP PROFESSIONAL DEVELOPMENT</p></div>
   <div class="chart" style="background:${C.paper};border-radius:20px;padding:40px 50px;display:flex;flex-direction:column;align-items:center;gap:14px;color:${C.ink};font-family:var(--display);font-weight:800">
     ${[['W',120,C.ink],['H A T',96,C.ink],['D O &nbsp;U S E E',70,C.ink],['UNDERSTANDING',48,C.u],['SAFETY',48,C.s],['EFFICIENCY',48,C.e1],['ENGAGEMENT',48,C.e2]].map(r=>`<span class="cr" style="font-size:${r[1]}px;color:${r[2]};letter-spacing:.12em;line-height:1">${r[0]}</span>`).join('')}
   </div></div>`,
   u:(el,lt)=>{ stagger(el,'.f',lt,.3,.9); el.querySelectorAll('.cr').forEach((n,i)=>{const x=(lt-.6-i*.45)/1; const e=ease(x); n.style.opacity=clamp(x*2); n.style.filter=`blur(${(1-e)*22}px)`;}); } },
 people:{ b:()=>`<div class="grid2">${[['James Durazzo','Professional Development Manager, Staten Island','Office of Food and Nutrition Services',C.u],['Chef Safaa','District Cook Ambassador','"I\'m a cook, just like all of you."',C.act]].map(p=>`<div class="card f" style="background:#fff;display:flex;flex-direction:column;gap:22px;min-height:440px;justify-content:flex-end;border-top:14px solid ${p[3]}"><span class="d" style="font-size:84px">${p[0]}</span><span style="font-size:36px;font-weight:700">${p[1]}</span><span style="font-size:30px;color:${C.dim}">${p[2]}</span></div>`).join('')}</div>`,
   u:(el,lt)=>stagger(el,'.f',lt,.6,.9) },
 acronym:{ b:()=>`<div class="grid4">${LENS.map(L=>`<div class="ac" style="display:flex;flex-direction:column;gap:20px"><span class="d" style="font-size:300px;color:${L.c};line-height:.8">${L.l}</span><span class="d w" style="font-size:52px;color:${C.paper}">${L.w}</span></div>`).join('')}</div><p class="f" style="margin:0;font-size:40px;color:${C.ndim};max-width:1400px">Four things every cook should look at before jumping in to fix whatever's happening in the kitchen.</p>`,
   u:(el,lt)=>{ el.querySelectorAll('.ac').forEach((n,i)=>focus(n,(lt-i*.35)/.8)); el.querySelectorAll('.w').forEach((n,i)=>focus(n,(lt-2-i*.3)/.8,10)); focus(el.querySelector('p.f'),(lt-6)/1); } },
 list:{ b:(b)=>`<span class="m f" style="font-size:26px;color:${C.dim}">${b.head.toUpperCase()}</span><div style="display:flex;flex-direction:column;gap:22px">${b.items.map((x,i)=>`<div class="f" style="display:flex;align-items:center;gap:30px"><span style="width:20px;height:20px;border-radius:50%;background:${[C.u,C.s,C.e1,C.e2,C.act][i%5]}"></span><span class="d" style="font-size:80px">${x}</span></div>`).join('')}</div>`,
   u:(el,lt,p)=>{ const n=el.querySelectorAll('.f'); n.forEach((x,i)=>focus(x,(p*1.25-i/n.length)*n.length*.9)); } },
 big:{ b:(b,th)=>bigText(b.text,b.size||120,b.color,th.fg), u:(el,lt)=>stagger(el,'.f',lt,.22,.8) },
 lenses:{ b:()=>`<div class="grid2">${LENS.map(L=>`<div class="card f" style="background:#fff;display:flex;gap:30px;align-items:center"><span class="d" style="flex:none;width:120px;height:120px;border-radius:50%;background:${L.c};color:#fff;display:flex;align-items:center;justify-content:center;font-size:70px">${L.l}</span><span style="font-size:44px;font-weight:700;line-height:1.15">${['Do I understand what\'s actually going on?','Is it safe?','Is there a smarter way to do it?','How will this affect my team?'][LENS.indexOf(L)]}</span></div>`).join('')}</div>`,
   u:(el,lt,p)=>stagger(el,'.f',lt,(p>0?(el._d||1):1)*1.6,.9) },
 motto:{ b:(b)=>`<div style="display:flex;flex-direction:column;align-items:center;gap:40px;text-align:center"><div class="f" style="color:${C.paper}">${glasses(460)}</div><p class="f m" style="margin:0;font-size:30px;color:${C.ndim}">BEFORE I ACT,</p><h2 class="d f" style="font-size:180px;color:${C.paper}">what do U.S.E.E.?</h2>${b.end?`<p class="f m" style="margin:0;font-size:24px;color:${C.ndim}">KITCHEN LEADERSHIP PROFESSIONAL DEVELOPMENT  /  JAMES DURAZZO WITH CHEF SAFAA</p>`:''}</div>`,
   u:(el,lt)=>stagger(el,'.f',lt,.5,1) },
 section:{ b:(b)=>{ const all=b.lens===4; const L=all?null:LENS[b.lens]; return `<span class="m f" style="font-size:28px;color:${C.ndim}">${all?'FINAL SECTION':'SECTION '+(b.lens+1)}</span>${all?`<div style="display:flex;gap:40px">${LENS.map(x=>`<span class="d f" style="font-size:280px;color:${x.c};line-height:.8">${x.l}</span>`).join('')}</div><h2 class="d f" style="font-size:120px;color:${C.paper}">Putting it together.</h2>`:`<h2 class="d f sw" style="font-size:240px;color:${C.paper}">${L.w}</h2><div class="bar" style="height:16px;width:0;background:${L.c};border-radius:8px"></div><p class="f" style="margin:0;font-size:44px;color:${C.ndim}">${L.q}</p>`}`; },
   u:(el,lt)=>{ el.querySelectorAll('.f').forEach((n,i)=>{const x=(lt-i*.35)/1.1; const e=ease(x); n.style.opacity=clamp(x*2); n.style.filter=`blur(${(1-e)*30}px)`; n.style.letterSpacing=n.classList.contains('sw')?`${(1-e)*.2-.025}em`:'';}); const b=el.querySelector('.bar'); if(b) b.style.width=(ease((lt-.8)/1)*900)+'px'; } },
 buckets:{ b:()=>`<div class="grid3">${[['CONTROL','What you own.','What can I do right now?',['Tasks','Workflow','Safety','Coaching'],C.s],['INFLUENCE','What you can help improve.','How can I make it better?',['Morale','Teamwork','Attitude','Focus'],C.e1],['COMMUNICATE','What you pass up the line.','Who needs to know?',['Staffing','Broken equipment','Deliveries','Participation'],C.u]].map(c=>`<div class="card f" style="background:#fff;display:flex;flex-direction:column;gap:18px;border-top:14px solid ${c[4]}"><span class="m" style="font-size:24px;color:${c[4]}">${c[0]}</span><span class="d" style="font-size:52px">${c[1]}</span><span style="font-size:30px;font-style:italic;color:${C.dim}">${c[2]}</span><div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:10px">${c[3].map(t=>`<span class="chip" style="font-size:26px;padding:10px 20px;border-radius:30px;background:${C.paper2}">${t}</span>`).join('')}</div></div>`).join('')}</div>`,
   u:(el,lt,p)=>{ el.querySelectorAll('.card').forEach((n,i)=>focus(n,(p*3.2-i*.9)*1.2)); el.querySelectorAll('.chip').forEach((n,i)=>{ n.style.opacity=clamp((p*3.2-Math.floor(i/4)*.9-.4-(i%4)*.1)*3); }); } },
 groups:{ b:()=>`<div class="grid3">${[['GROUP 1','Someone called out.','Lunch starts in 45 minutes.'],['GROUP 2','The milk chest breaks down.','In the middle of service.'],['GROUP 3','100 more students.','Just showed up for lunch.']].map((g,i)=>`<div class="card f" style="background:${C.night};color:${C.paper};min-height:460px;display:flex;flex-direction:column;justify-content:space-between"><span class="m" style="font-size:24px;color:${C.ndim}">${g[0]}</span><span class="d" style="font-size:62px">${g[1]}</span><span style="font-size:32px;color:${C.ndim}">${g[2]}</span></div>`).join('')}</div><div class="f m" style="font-size:26px;color:${C.dim}">SORT EVERY CHALLENGE CARD: CONTROL, INFLUENCE, OR COMMUNICATE.  /  10 MINUTES</div>`,

let curB=null, curEl=null;
const beatsEl=$('beats'), stage=$('stage');
function lineAt(t){ let r=null; for(const l of LINES){ if(t>=l.t) r=l; else break; } return r; }
function beatAt(t){ let r=ALLB[0]; for(const b of ALLB){ if(t>=b.t0) r=b; else break; } return r; }
function secAt(t){ let r=TL.sections[0]; for(const s of TL.sections){ if(t>=s.t) r=s; else break; } return r; }

function renderAt(t){
  t=clamp(t,0,TOTAL-.001);
  const b=beatAt(t), dark=!!b.dark, th=dark?{bg:C.night,fg:C.paper,dim:C.ndim}:{bg:C.paper,fg:C.ink,dim:C.dim};
  // Background: when a beat flips between light and dark, the new ground wipes up from the bottom.
  const i=ALLB.indexOf(b), prev=ALLB[i-1], prevDark=prev?!!prev.dark:dark;
  $('bgA').style.background=th.bg;
  $('bgB').style.background=prevDark?C.night:C.paper;
  $('bgB').style.clipPath=`inset(0 0 ${ease((t-b.t0)/.8)*100}% 0)`;
  const sec=secAt(t), li=SEC_LENS[sec.id];
  $('seclab').textContent=sec.title.toUpperCase(); $('seclab').style.color=th.dim;
  $('tracker').querySelectorAll('span').forEach((s,k)=>{ const on=li===4||k===li, done=li>k&&li!==4; s.style.color=on?LENS[k].c:(done?LENS[k].c:th.dim); s.style.background=on?LENS[k].c:'transparent'; s.style.borderColor=on||done?LENS[k].c:th.dim; s.style.opacity=on||done?1:.45; if(on){s.style.color='#fff';} });
  const l=lineAt(t);
  if(l){ const sp=SPK[l.spk]||SPK.NARRATOR; $('who').querySelector('i').style.background=sp.c; $('who').querySelector('b').textContent=sp.n+(sp.r?'  /  '+sp.r:''); $('who').style.color=th.dim; const ch=[...l.chunks].reverse().find(c=>t>=c.t)||l.chunks[0]; $('cap').textContent=ch.text; $('cap').style.color=th.fg; $('cap').style.fontStyle=l.spk==='NARRATOR'?'italic':'normal'; }
  $('prog').style.width=(t/TOTAL*100)+'%'; $('prog').style.background=li>=0&&li<4?LENS[li].c:C.e1;
  if(b!==curB){ curB=b; beatsEl.innerHTML=''; curEl=document.createElement('div'); curEl.className='beat'; curEl.style.color=th.fg; curEl.innerHTML=K[b.k].b(b,th); curEl._dur=b.t1-b.t0; curEl.querySelectorAll('h2.d').forEach(h=>h.style.whiteSpace='pre-line'); beatsEl.appendChild(curEl); }
  const lt=t-b.t0, dur=b.t1-b.t0, p=clamp(lt/dur);
  K[b.k].u(curEl,lt,p,b);
  const out=ease((lt-(dur-.45))/.45);
  curEl.style.opacity=1-out; curEl.style.filter=out>0?`blur(${out*12}px)`:'none';
}
window.renderAt=renderAt; window.TOTAL=TOTAL;

let playing=false, t=0, last=0;

scrub.max=TOTAL;
function sync(){ renderAt(t); scrub.value=t; clock.textContent=`${fmt(t)} / ${fmt(TOTAL)}`; }
function tick(now){ if(!playing) return; if(TL.audio&&!vo.paused){ t=vo.currentTime; } else { t+=(now-last)/1000; } last=now; if(t>=TOTAL){ t=TOTAL; playing=false; play.textContent='Play'; } sync(); requestAnimationFrame(tick); }
play.addEventListener('click',()=>{ playing=!playing; play.textContent=playing?'Pause':'Play'; if(playing){ if(t>=TOTAL) t=0; last=performance.now(); if(TL.audio){ vo.currentTime=t; vo.play().catch(()=>{}); } requestAnimationFrame(tick);} else if(TL.audio){ vo.pause(); } });
scrub.addEventListener('input',()=>{ t=+scrub.value; if(TL.audio) vo.currentTime=t; sync(); });
t=isRender?0:4; sync();
document.fonts&&document.fonts.ready.then(()=>{ curB=null; sync(); });
</script>
