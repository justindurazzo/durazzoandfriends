<script>
const TL = {"total": 809.23, "sections": [{"id": "00", "title": "Welcome", "t": 0.0}, {"id": "01", "title": "The big question", "t": 76.22}, {"id": "02", "title": "Understanding", "t": 113.52}, {"id": "03", "title": "Safety", "t": 303.7}, {"id": "04", "title": "Efficiency", "t": 443.85}, {"id": "05", "title": "Engagement", "t": 543.69}, {"id": "06", "title": "Putting it together", "t": 685.91}, {"id": "07", "title": "Close", "t": 783.24}], "lines": [{"spk": "NARRATOR", "text": "Cooks arrive, sign in, and find a workbook and a pen at every seat. Breakfast is out. The coffee is hot.", "sec": "00", "t": 0.0, "chunks": [{"t": 0.0, "text": "Cooks arrive, sign in, and find a workbook and a pen at every seat."}, {"t": 5.7, "text": "Breakfast is out."}, {"t": 7.15, "text": "The coffee is hot."}]}, {"spk": "JAMES", "text": "Good morning, everybody, and welcome. I'm James Durazzo, the Professional Development Manager for Staten Island with the Office of Food and Nutrition Services. And with me today is our District Cook Ambassador, Chef Safaa.", "sec": "00", "t": 9.13, "chunks": [{"t": 9.13, "text": "Good morning, everybody, and welcome."}, {"t": 11.49, "text": "I'm James Durazzo, the Professional Development Manager for Staten Island with the Office of Food and Nutrition Services."}, {"t": 19.22, "text": "And with me today is our District Cook Ambassador, Chef Safaa."}]}, {"spk": "SAFAA", "text": "Good morning! I'm a cook, just like all of you. So I'm really glad to be here.", "sec": "00", "t": 23.63, "chunks": [{"t": 23.63, "text": "Good morning!"}, {"t": 24.83, "text": "I'm a cook, just like all of you."}, {"t": 27.88, "text": "So I'm really glad to be here."}]}, {"spk": "JAMES", "text": "Today's session comes from a framework we built for our new School Food Service Managers. We call it What Do U.S.E.E.? U.S.E.E. stands for Understanding, Safety, Efficiency, and Engagement. Four things every cook should look at before jumping in to fix whatever's happening in the kitchen. And I mean every cook. Whether you're in charge or you're an assistant cook.", "sec": "00", "t": 31.1, "chunks": [{"t": 31.1, "text": "Today's session comes from a framework we built for our new School Food Service Managers."}, {"t": 37.23, "text": "We call it What Do U.S.E.E.?"}, {"t": 39.16, "text": "U.S.E.E."}, {"t": 39.71, "text": "stands for Understanding, Safety, Efficiency, and Engagement."}, {"t": 43.91, "text": "Four things every cook should look at before jumping in to fix whatever's happening in the kitchen."}, {"t": 50.73, "text": "And I mean every cook."}, {"t": 52.25, "text": "Whether you're in charge or you're an assistant cook."}]}, {"spk": "JAMES", "text": "A few ground rules before we start. Have fun. Listen to understand. Share what you know, because every voice in here matters. Phones on vibrate, please. And no side conversations. If you've got something to say, say it to the whole room. We want to hear it.", "sec": "00", "t": 56.35, "chunks": [{"t": 56.35, "text": "A few ground rules before we start."}, {"t": 59.06, "text": "Have fun."}, {"t": 59.76, "text": "Listen to understand."}, {"t": 61.4, "text": "Share what you know, because every voice in here matters."}, {"t": 65.82, "text": "Phones on vibrate, please."}, {"t": 67.84, "text": "And no side conversations."}, {"t": 69.86, "text": "If you've got something to say, say it to the whole room."}, {"t": 74.29, "text": "We want to hear it."}]}, {"spk": "JAMES", "text": "So here's the question for today. How can I use U.S.E.E. to lead my kitchen better, every single day?", "sec": "01", "t": 76.22, "chunks": [{"t": 76.22, "text": "So here's the question for today."}, {"t": 78.83, "text": "How can I use U.S.E.E."}, {"t": 80.58, "text": "to lead my kitchen better, every single day?"}]}, {"spk": "JAMES", "text": "Every day, things come up that need a decision. U.S.E.E. gives you four ways to look at them. Do I understand what's actually going on? Is it safe? Is there a smarter way to do it? And how is this going to affect my team?", "sec": "01", "t": 84.52, "chunks": [{"t": 84.52, "text": "Every day, things come up that need a decision."}, {"t": 88.58, "text": "U.S.E.E."}, {"t": 89.28, "text": "gives you four ways to look at them."}, {"t": 92.39, "text": "Do I understand what's actually going on?"}, {"t": 95.93, "text": "Is it safe?"}, {"t": 96.89, "text": "Is there a smarter way to do it?"}, {"t": 99.65, "text": "And how is this going to affect my team?"}]}, {"spk": "JAMES", "text": "By the end of today, it all comes down to one question you can carry with you. Before I act, what do U.S.E.E.?", "sec": "01", "t": 103.56, "chunks": [{"t": 103.56, "text": "By the end of today, it all comes down to one question you can carry with you."}, {"t": 110.36, "text": "Before I act, what do U.S.E.E.?"}]}, {"spk": "NARRATOR", "text": "Section one. Understanding.", "sec": "02", "t": 113.52, "chunks": [{"t": 113.52, "text": "Section one."}, {"t": 114.09, "text": "Understanding."}]}, {"spk": "JAMES", "text": "Understanding means knowing your team, your students, and your kitchen really well. But it's more than knowing what's happening. It's knowing what you can do about it.", "sec": "02", "t": 115.21, "chunks": [{"t": 115.21, "text": "Understanding means knowing your team, your students, and your kitchen really well."}, {"t": 120.82, "text": "But it's more than knowing what's happening."}, {"t": 123.79, "text": "It's knowing what you can do about it."}]}, {"spk": "JAMES", "text": "Because you can't spend your whole day frustrated by things you can't control. So let's sort it into three buckets. Control is what you own. Your tasks, your workflow, safety, coaching your people. Ask yourself, what can I do right now? Influence is what you can help improve, like morale and teamwork. And Communicate is what you need to pass up the line. Staffing, broken equipment, deliveries. Ask, who needs to know this so it gets fixed?", "sec": "02", "t": 126.81, "chunks": [{"t": 126.81, "text": "Because you can't spend your whole day frustrated by things you can't control."}, {"t": 132.53, "text": "So let's sort it into three buckets."}, {"t": 135.17, "text": "Control is what you own."}, {"t": 136.93, "text": "Your tasks, your workflow, safety, coaching your people."}, {"t": 141.04, "text": "Ask yourself, what can I do right now?"}, {"t": 143.82, "text": "Influence is what you can help improve, like morale and teamwork."}, {"t": 148.59, "text": "And Communicate is what you need to pass up the line."}, {"t": 152.47, "text": "Staffing, broken equipment, deliveries."}, {"t": 155.33, "text": "Ask, who needs to know this so it gets fixed?"}]}, {"spk": "NARRATOR", "text": "The room splits into three groups. Each one gets a scenario and a stack of challenge cards to sort into three piles. Group one: someone called out, and lunch starts in forty five minutes. Group two: the milk chest breaks down in the middle of service. Group three: a hundred more students than usual just showed up for lunch.", "sec": "02", "t": 159.08, "chunks": [{"t": 159.08, "text": "The room splits into three groups."}, {"t": 161.66, "text": "Each one gets a scenario and a stack of challenge cards to sort into three piles."}, {"t": 167.82, "text": "Group one: someone called out, and lunch starts in forty five minutes."}, {"t": 173.13, "text": "Group two: the milk chest breaks down in the middle of service."}, {"t": 177.92, "text": "Group three: a hundred more students than usual just showed up for lunch."}]}, {"spk": "NARRATOR", "text": "Ten minutes later, group two reports back.", "sec": "02", "t": 183.91, "chunks": [{"t": 183.91, "text": "Ten minutes later, group two reports back."}]}, {"spk": "COOK", "text": "Our milk chest broke during service. What we control: pull the milk, move it to another fridge, and temp it. What we influence: keep everybody calm and focused. What we communicate: report it to our manager and write down what happened.", "sec": "02", "t": 187.25, "chunks": [{"t": 187.25, "text": "Our milk chest broke during service."}, {"t": 189.87, "text": "What we control: pull the milk, move it to another fridge, and temp it."}, {"t": 195.04, "text": "What we influence: keep everybody calm and focused."}, {"t": 198.74, "text": "What we communicate: report it to our manager and write down what happened."}]}, {"spk": "JAMES", "text": "That's exactly right.", "sec": "02", "t": 204.65, "chunks": [{"t": 204.65, "text": "That's exactly right."}]}, {"spk": "SAFAA", "text": "You know, that actually happened in my kitchen. And the very first thing I did was check the temperature of the milk. Because if it's already out of range, it doesn't matter where you move it.", "sec": "02", "t": 206.34, "chunks": [{"t": 206.34, "text": "You know, that actually happened in my kitchen."}, {"t": 210.02, "text": "And the very first thing I did was check the temperature of the milk."}, {"t": 215.42, "text": "Because if it's already out of range, it doesn't matter where you move it."}]}, {"spk": "JAMES", "text": "And that's the whole point. A lot of frustration at work doesn't come from bad intentions. It comes from acting on assumptions instead of facts. When we skip understanding, we solve the wrong problem, we miss information, we stress people out, and sometimes we put safety at risk.", "sec": "02", "t": 221.66, "chunks": [{"t": 221.66, "text": "And that's the whole point."}, {"t": 223.6, "text": "A lot of frustration at work doesn't come from bad intentions."}, {"t": 228.04, "text": "It comes from acting on assumptions instead of facts."}, {"t": 231.83, "text": "When we skip understanding, we solve the wrong problem, we miss information, we stress people out, and sometimes we put safety at risk."}]}, {"spk": "JAMES", "text": "Understanding doesn't mean waiting. It means responding to the real problem, not just the first one you notice. Anyone have a time when a problem wasn't what it looked like?", "sec": "02", "t": 241.95, "chunks": [{"t": 241.95, "text": "Understanding doesn't mean waiting."}, {"t": 244.48, "text": "It means responding to the real problem, not just the first one you notice."}, {"t": 249.92, "text": "Anyone have a time when a problem wasn't what it looked like?"}]}, {"spk": "SAFAA", "text": "I had a worker who was slow every single morning. I almost wrote him up. Then I asked him about it. Turns out the slicer was dull, and he was afraid to say anything. One question changed everything.", "sec": "02", "t": 254.79, "chunks": [{"t": 254.79, "text": "I had a worker who was slow every single morning."}, {"t": 258.76, "text": "I almost wrote him up."}, {"t": 260.54, "text": "Then I asked him about it."}, {"t": 262.65, "text": "Turns out the slicer was dull, and he was afraid to say anything."}, {"t": 267.91, "text": "One question changed everything."}]}, {"spk": "JAMES", "text": "Let's practice. Four scenarios. Someone's working really slowly during prep. The serving line is backing up and kids are waiting. The chicken is temping below holding temperature. And there's a wet floor by the dish machine. Which ones need action right now?", "sec": "02", "t": 270.95, "chunks": [{"t": 270.95, "text": "Let's practice."}, {"t": 271.98, "text": "Four scenarios."}, {"t": 273.01, "text": "Someone's working really slowly during prep."}, {"t": 276.04, "text": "The serving line is backing up and kids are waiting."}, {"t": 279.62, "text": "The chicken is temping below holding temperature."}, {"t": 283.0, "text": "And there's a wet floor by the dish machine."}, {"t": 286.03, "text": "Which ones need action right now?"}]}, {"spk": "COOK", "text": "The chicken and the wet floor. That's safety. Somebody could get sick, or somebody could get hurt.", "sec": "02", "t": 288.75, "chunks": [{"t": 288.75, "text": "The chicken and the wet floor."}, {"t": 290.95, "text": "That's safety."}, {"t": 291.97, "text": "Somebody could get sick, or somebody could get hurt."}]}, {"spk": "JAMES", "text": "That's right. Good leaders try to understand everything. But when safety's on the line, you act first.", "sec": "02", "t": 296.23, "chunks": [{"t": 296.23, "text": "That's right."}, {"t": 297.14, "text": "Good leaders try to understand everything."}, {"t": 300.09, "text": "But when safety's on the line, you act first."}]}, {"spk": "NARRATOR", "text": "Section two. Safety.", "sec": "03", "t": 303.7, "chunks": [{"t": 303.7, "text": "Section two."}, {"t": 304.48, "text": "Safety."}]}, {"spk": "JAMES", "text": "Understanding is where we start. But in a kitchen, sometimes you don't have time to think it over. When there's a hazard, safety comes first.", "sec": "03", "t": 305.39, "chunks": [{"t": 305.39, "text": "Understanding is where we start."}, {"t": 307.77, "text": "But in a kitchen, sometimes you don't have time to think it over."}, {"t": 312.6, "text": "When there's a hazard, safety comes first."}]}, {"spk": "JAMES", "text": "Safety means protecting your staff, your students, and your food. And it shows up three ways. Physical safety: a clean kitchen, equipment used right, food handled right. Emotional safety: people talk to each other with respect, and they feel supported. And procedural safety: following the policies, the routines, and the regulations.", "sec": "03", "t": 316.17, "chunks": [{"t": 316.17, "text": "Safety means protecting your staff, your students, and your food."}, {"t": 320.32, "text": "And it shows up three ways."}, {"t": 322.05, "text": "Physical safety: a clean kitchen, equipment used right, food handled right."}, {"t": 326.84, "text": "Emotional safety: people talk to each other with respect, and they feel supported."}, {"t": 332.07, "text": "And procedural safety: following the policies, the routines, and the regulations."}]}, {"spk": "SAFAA", "text": "For physical safety, every morning before we start, I walk the floor. Cords, boxes, a wet spot. We fix it before anybody gets hurt.", "sec": "03", "t": 337.7, "chunks": [{"t": 337.7, "text": "For physical safety, every morning before we start, I walk the floor."}, {"t": 343.0, "text": "Cords, boxes, a wet spot."}, {"t": 344.92, "text": "We fix it before anybody gets hurt."}]}, {"spk": "COOK 2", "text": "For emotional safety, when somebody messes up, I don't yell in front of everybody. I pull them aside and we talk about it.", "sec": "03", "t": 348.06, "chunks": [{"t": 348.06, "text": "For emotional safety, when somebody messes up, I don't yell in front of everybody."}, {"t": 354.5, "text": "I pull them aside and we talk about it."}]}, {"spk": "COOK", "text": "And procedural. Filling out the temp log every single day. Not on Friday for the whole week.", "sec": "03", "t": 358.02, "chunks": [{"t": 358.02, "text": "And procedural."}, {"t": 359.19, "text": "Filling out the temp log every single day."}, {"t": 362.47, "text": "Not on Friday for the whole week."}]}, {"spk": "NARRATOR", "text": "Next, the safety scavenger hunt. Each group gets a big poster of a busy kitchen, and seven minutes to find every hazard they can.", "sec": "03", "t": 365.49, "chunks": [{"t": 365.49, "text": "Next, the safety scavenger hunt."}, {"t": 367.97, "text": "Each group gets a big poster of a busy kitchen, and seven minutes to find every hazard they can."}]}, {"spk": "COOK", "text": "Physical. A wet floor, and a guy running right through it carrying a stack of pans.", "sec": "03", "t": 375.86, "chunks": [{"t": 375.86, "text": "Physical."}, {"t": 376.59, "text": "A wet floor, and a guy running right through it carrying a stack of pans."}]}, {"spk": "COOK 2", "text": "Procedural. The temp log is blank, and the allergen sign just says, ask your manager.", "sec": "03", "t": 382.92, "chunks": [{"t": 382.92, "text": "Procedural."}, {"t": 383.73, "text": "The temp log is blank, and the allergen sign just says, ask your manager."}]}, {"spk": "COOK", "text": "Emotional. The daily plan on the wall says hurry, do more with less, be perfect. And there's two people arguing in the corner.", "sec": "03", "t": 389.57, "chunks": [{"t": 389.57, "text": "Emotional."}, {"t": 390.34, "text": "The daily plan on the wall says hurry, do more with less, be perfect."}, {"t": 395.62, "text": "And there's two people arguing in the corner."}]}, {"spk": "JAMES", "text": "Look at how many there are. Now, what has to be fixed right away? And is there anything in this picture that's out of the Cook in Charge's control?", "sec": "03", "t": 399.52, "chunks": [{"t": 399.52, "text": "Look at how many there are."}, {"t": 401.76, "text": "Now, what has to be fixed right away?"}, {"t": 404.81, "text": "And is there anything in this picture that's out of the Cook in Charge's control?"}]}, {"spk": "COOK 2", "text": "The broken equipment. We can't fix that ourselves. We report it.", "sec": "03", "t": 411.96, "chunks": [{"t": 411.96, "text": "The broken equipment."}, {"t": 413.5, "text": "We can't fix that ourselves."}, {"t": 415.55, "text": "We report it."}]}, {"spk": "JAMES", "text": "Exactly. That's the Understanding lens coming right back in. And here's the bigger idea. Don't just see the hazard. See why it's there. People are rushing. Stations aren't organized. Procedures get skipped. Nobody says anything. So you see the hazard, you see why it exists, and you fix the why. A safe kitchen is built by leaders who care, and teams who speak up.", "sec": "03", "t": 416.95, "chunks": [{"t": 416.95, "text": "Exactly."}, {"t": 417.55, "text": "That's the Understanding lens coming right back in."}, {"t": 421.36, "text": "And here's the bigger idea."}, {"t": 423.38, "text": "Don't just see the hazard."}, {"t": 425.32, "text": "See why it's there."}, {"t": 426.74, "text": "People are rushing."}, {"t": 428.16, "text": "Stations aren't organized."}, {"t": 430.1, "text": "Procedures get skipped."}, {"t": 431.82, "text": "Nobody says anything."}, {"t": 433.39, "text": "So you see the hazard, you see why it exists, and you fix the why."}, {"t": 438.32, "text": "A safe kitchen is built by leaders who care, and teams who speak up."}]}, {"spk": "NARRATOR", "text": "After a short coffee break, section three. Efficiency.", "sec": "04", "t": 443.85, "chunks": [{"t": 443.85, "text": "After a short coffee break, section three."}, {"t": 446.47, "text": "Efficiency."}]}, {"spk": "JAMES", "text": "We spent the morning finding hazards. But most safety problems don't start because people don't care. They start because something in the operation isn't working. Supplies aren't where they should be. People are rushing because the day wasn't planned.", "sec": "04", "t": 447.6, "chunks": [{"t": 447.6, "text": "We spent the morning finding hazards."}, {"t": 450.02, "text": "But most safety problems don't start because people don't care."}, {"t": 454.13, "text": "They start because something in the operation isn't working."}, {"t": 458.04, "text": "Supplies aren't where they should be."}, {"t": 460.46, "text": "People are rushing because the day wasn't planned."}]}, {"spk": "JAMES", "text": "So, efficiency. And I want to be clear, efficiency is not working faster, and it's not doing more with fewer people. It's getting the best result with the least wasted time, effort, food, and energy, without giving up safety or quality.", "sec": "04", "t": 464.17, "chunks": [{"t": 464.17, "text": "So, efficiency."}, {"t": 465.26, "text": "And I want to be clear, efficiency is not working faster, and it's not doing more with fewer people."}, {"t": 472.5, "text": "It's getting the best result with the least wasted time, effort, food, and energy, without giving up safety or quality."}]}, {"spk": "JAMES", "text": "We look at it in four areas. Operational: is there an easier way to get the same result? Resources: are we wasting food, supplies, or energy? Time: what should happen first? And people: does everybody know what a good job looks like? These four are connected. Bad planning turns into time problems. Bad communication turns into people problems. Your job is to spot what's in the way, and move it.", "sec": "04", "t": 481.56, "chunks": [{"t": 481.56, "text": "We look at it in four areas."}, {"t": 483.65, "text": "Operational: is there an easier way to get the same result?"}, {"t": 488.05, "text": "Resources: are we wasting food, supplies, or energy?"}, {"t": 491.93, "text": "Time: what should happen first?"}, {"t": 494.24, "text": "And people: does everybody know what a good job looks like?"}, {"t": 498.63, "text": "These four are connected."}, {"t": 500.5, "text": "Bad planning turns into time problems."}, {"t": 503.33, "text": "Bad communication turns into people problems."}, {"t": 506.69, "text": "Your job is to spot what's in the way, and move it."}]}, {"spk": "SAFAA", "text": "I'll go first. For me, it's time. Our deliveries come right in the middle of prep, and everything stops. So on delivery days, we do our prep the afternoon before.", "sec": "04", "t": 510.94, "chunks": [{"t": 510.94, "text": "I'll go first."}, {"t": 512.03, "text": "For me, it's time."}, {"t": 513.43, "text": "Our deliveries come right in the middle of prep, and everything stops."}, {"t": 518.89, "text": "So on delivery days, we do our prep the afternoon before."}]}, {"spk": "COOK 2", "text": "Mine's people. Nobody on my team is cross trained on the dish machine. So when one person's out, we're stuck. This month, I'm going to train two more people on it.", "sec": "04", "t": 523.79, "chunks": [{"t": 523.79, "text": "Mine's people."}, {"t": 524.91, "text": "Nobody on my team is cross trained on the dish machine."}, {"t": 529.31, "text": "So when one person's out, we're stuck."}, {"t": 532.35, "text": "This month, I'm going to train two more people on it."}]}, {"spk": "JAMES", "text": "That's it. Efficiency isn't more work. It's making it easier to do the right work.", "sec": "04", "t": 537.05, "chunks": [{"t": 537.05, "text": "That's it."}, {"t": 537.82, "text": "Efficiency isn't more work."}, {"t": 539.91, "text": "It's making it easier to do the right work."}]}, {"spk": "NARRATOR", "text": "Lunch. Somebody else cooks, for a change. Then section four, Engagement. And it starts with a game.", "sec": "05", "t": 543.69, "chunks": [{"t": 543.69, "text": "Lunch."}, {"t": 544.13, "text": "Somebody else cooks, for a change."}, {"t": 546.62, "text": "Then section four, Engagement."}, {"t": 548.82, "text": "And it starts with a game."}]}, {"spk": "SAFAA", "text": "Okay, brain teaser. What has to be broken before you can use it?", "sec": "05", "t": 551.17, "chunks": [{"t": 551.17, "text": "Okay, brain teaser."}, {"t": 552.79, "text": "What has to be broken before you can use it?"}]}, {"spk": "COOK", "text": "An egg!", "sec": "05", "t": 556.99, "chunks": [{"t": 556.99, "text": "An egg!"}]}, {"spk": "SAFAA", "text": "That's it! Next.", "sec": "05", "t": 558.27, "chunks": [{"t": 558.27, "text": "That's it!"}, {"t": 559.09, "text": "Next."}]}, {"spk": "JAMES", "text": "Give yourselves a hand. And notice, what made that fun wasn't really the riddles. It was that everybody got to play.", "sec": "05", "t": 559.96, "chunks": [{"t": 559.96, "text": "Give yourselves a hand."}, {"t": 561.71, "text": "And notice, what made that fun wasn't really the riddles."}, {"t": 566.05, "text": "It was that everybody got to play."}]}, {"spk": "JAMES", "text": "Engagement means building a kitchen where people feel valued, respected, and connected to why we're here, which is feeding kids. Kitchens don't succeed because of policies or schedules or equipment. They succeed because of people.", "sec": "05", "t": 569.08, "chunks": [{"t": 569.08, "text": "Engagement means building a kitchen where people feel valued, respected, and connected to why we're here, which is feeding kids."}, {"t": 577.2, "text": "Kitchens don't succeed because of policies or schedules or equipment."}, {"t": 581.58, "text": "They succeed because of people."}]}, {"spk": "JAMES", "text": "So here's the activity. Write down one idea to get your staff, your students, or your school more involved in breakfast or lunch. Then, after each person shares, someone else is going to affirm them.", "sec": "05", "t": 584.0, "chunks": [{"t": 584.0, "text": "So here's the activity."}, {"t": 585.69, "text": "Write down one idea to get your staff, your students, or your school more involved in breakfast or lunch."}, {"t": 593.39, "text": "Then, after each person shares, someone else is going to affirm them."}]}, {"spk": "SAFAA", "text": "My idea is a monthly student taste test. The kids vote on a new recipe before it goes on the menu.", "sec": "05", "t": 598.91, "chunks": [{"t": 598.91, "text": "My idea is a monthly student taste test."}, {"t": 602.49, "text": "The kids vote on a new recipe before it goes on the menu."}]}, {"spk": "JAMES", "text": "Safaa, I love that. Kids eat what they help choose. It stands out to me because it gives students a real voice in our program. I can't wait to see how you put it in place, and if I can help, just let me know.", "sec": "05", "t": 608.04, "chunks": [{"t": 608.04, "text": "Safaa, I love that."}, {"t": 609.76, "text": "Kids eat what they help choose."}, {"t": 612.57, "text": "It stands out to me because it gives students a real voice in our program."}, {"t": 619.28, "text": "I can't wait to see how you put it in place, and if I can help, just let me know."}]}, {"spk": "JAMES", "text": "That's engagement in action. People want to know their voice matters. Engagement is ownership. Stop saying, that's not my job. Start saying, how can I help us win? And it's purpose. People don't just follow instructions. They follow a reason. So tell them why.", "sec": "05", "t": 627.08, "chunks": [{"t": 627.08, "text": "That's engagement in action."}, {"t": 629.1, "text": "People want to know their voice matters."}, {"t": 631.99, "text": "Engagement is ownership."}, {"t": 633.72, "text": "Stop saying, that's not my job."}, {"t": 635.96, "text": "Start saying, how can I help us win?"}, {"t": 638.55, "text": "And it's purpose."}, {"t": 639.78, "text": "People don't just follow instructions."}, {"t": 64 let curB=null, curEl=null;
const beatsEl=$('beats'), stage=$('stage');
function lineAt(t){ let r=null; for(const l of LINES){ if(t>=l.t) r=l; else break; } return r; }
function beatAt(t){ let r=ALLB[0]; for(const b of ALLB){ if(t>=b.t0) r=b; else break; } return r; }
function secAt(t){ let r=TL.sections[0]; for(const s of TL.sections){ if(t>=s.t) r=s; else break; } return r; }

function renderAt(t){
  t=clamp(t,0,TOTAL-.001);
  const b=beatAt(t), dark=!!b.dark, th=dark?{bg:C.night,fg:C.paper,dim:C.ndim}:{bg:C.paper,fg:C.ink,dim:C.dim};
  // Background: when a beat flips between light and dark, the new ground wipes up from the bottom.
  const i=ALLB.indexOf(b), prev=ALLB[i-1], prevDark=prev?!!prev.dark:dark;
  $('bgA').style.background=th.bg;
  $('bgB').style.background=prevDark?C.night:C.paper;
  $('bgB').style.clipPath=`inset(0 0 ${ease((t-b.t0)/.8)*100}% 0)`;
  const sec=secAt(t), li=SEC_LENS[sec.id];
  $('seclab').textContent=sec.title.toUpperCase(); $('seclab').style.color=th.dim;
  $('tracker').querySelectorAll('span').forEach((s,k)=>{ const on=li===4||k===li, done=li>k&&li!==4; s.style.color=on?LENS[k].c:(done?LENS[k].c:th.dim); s.style.background=on?LENS[k].c:'transparent'; s.style.borderColor=on||done?LENS[k].c:th.dim; s.style.opacity=on||done?1:.45; if(on){s.style.color='#fff';} });
  const l=lineAt(t);
  if(l){ const sp=SPK[l.spk]||SPK.NARRATOR; $('who').querySelector('i').style.background=sp.c; $('who').querySelector('b').textContent=sp.n+(sp.r?'  /  '+sp.r:''); $('who').style.color=th.dim; const ch=[...l.chunks].reverse().find(c=>t>=c.t)||l.chunks[0]; $('cap').textContent=ch.text; $('cap').style.color=th.fg; $('cap').style.fontStyle=l.spk==='NARRATOR'?'italic':'normal'; }
  $('prog').style.width=(t/TOTAL*100)+'%'; $('prog').style.background=li>=0&&li<4?LENS[li].c:C.e1;
  if(b!==curB){ curB=b; beatsEl.innerHTML=''; curEl=document.createElement('div'); curEl.className='beat'; curEl.style.color=th.fg; curEl.innerHTML=K[b.k].b(b,th); curEl._dur=b.t1-b.t0; curEl.querySelectorAll('h2.d').forEach(h=>h.style.whiteSpace='pre-line'); beatsEl.appendChild(curEl); }
  const lt=t-b.t0, dur=b.t1-b.t0, p=clamp(lt/dur);
  K[b.k].u(curEl,lt,p,b);
  const out=ease((lt-(dur-.45))/.45);
  curEl.style.opacity=1-out; curEl.style.filter=out>0?`blur(${out*12}px)`:'none';
}
window.renderAt=renderAt; window.TOTAL=TOTAL;

function fit(){ stage.style.transform=`scale(${$('frame').clientWidth/1920})`; }
window.addEventListener('resize',fit);
const isRender=location.search.includes('render');
if(isRender) document.body.classList.add('render');
fit();

const vo=$('vo'); if(TL.audio) vo.src=TL.audio;
let playing=false, t=0, last=0;
const play=$('play'), scrub=$('scrub'), clock=$('clock');
scrub.max=TOTAL;
function sync(){ renderAt(t); scrub.value=t; clock.textContent=`${fmt(t)} / ${fmt(TOTAL)}`; }
function tick(now){ if(!playing) return; if(TL.audio&&!vo.paused){ t=vo.currentTime; } else { t+=(now-last)/1000; } last=now; if(t>=TOTAL){ t=TOTAL; playing=false; play.textContent='Play'; } sync(); requestAnimationFrame(tick); }
play.addEventListener('click',()=>{ playing=!playing; play.textContent=playing?'Pause':'Play'; if(playing){ if(t>=TOTAL) t=0; last=performance.now(); if(TL.audio){ vo.currentTime=t; vo.play().catch(()=>{}); } requestAnimationFrame(tick);} else if(TL.audio){ vo.pause(); } });
scrub.addEventListener('input',()=>{ t=+scrub.value; if(TL.audio) vo.currentTime=t; sync(); });
t=isRender?0:4; sync();
document.fonts&&document.fonts.ready.then(()=>{ curB=null; sync(); });
</script>
