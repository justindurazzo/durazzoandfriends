<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="Brainfart prototype: a finite daily program of 5, 10, and 15 minute learning films.">
<title>Brainfart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Fraunces:ital,wght@1,600&family=Instrument+Serif&family=Bricolage+Grotesque:wght@700&family=IM+Fell+English&family=Unbounded:wght@700&family=Young+Serif&family=Michroma&display=swap">
<style>
/* Layout: a phone app in an institution's clothes. White ground, black type, hard rules; every discipline speaks in its own typeface and its own flat color field, the way a kunsthalle gives each series an identity. */
:root {
  --desk: #e9e9e6;
  --bg: #ffffff;
  --fg: #000000;
  --muted: #6a6a6a;
  --line: #000000;
  --hair: #dcdcdc;
  --chip: #f2f2f2;
  --good: #0a7d3b;
  --bad: #d0281a;
  --ui: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --logo: "Archivo", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #161616; --bg: #0a0a0a; --fg: #f4f4f4; --muted: #9a9a9a; --line: #f4f4f4;
    --hair: #2c2c2c; --chip: #1c1c1c; --good: #4fd08a; --bad: #ff7766; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #161616; --bg: #0a0a0a; --fg: #f4f4f4; --muted: #9a9a9a; --line: #f4f4f4;
  --hair: #2c2c2c; --chip: #1c1c1c; --good: #4fd08a; --bad: #ff7766; color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--desk); color: var(--fg); font-family: var(--ui); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.mono { font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; font-variant-numeric: tabular-nums; }

/* Desk + device */
.desk { height: 100%; display: flex; align-items: center; justify-content: center; gap: 56px; padding-inline: 16px; padding-block: 24px; }
.aside { max-width: 300px; display: grid; gap: 14px; }
.aside .logo { font-size: 44px; }
.aside p { margin: 0; color: var(--muted); }
.device { position: relative; width: 100%; max-width: 410px; height: min(100%, 860px); background: var(--bg); border: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden; }
@media (max-width: 760px) {
  .desk { padding: 0; gap: 0; }
  .aside { display: none; }
  .device { max-width: none; height: 100%; border: 0; }
}

.logo { font-family: var(--logo); font-weight: 900; font-stretch: 112%; text-transform: uppercase; letter-spacing: -0.02em; line-height: 0.9; }

/* App bar */
.appbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); flex: none; }
.appbar .logo { font-size: 24px; }
.appbar .right { display: flex; align-items: center; gap: 12px; }
.screen { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
.pad { padding: 18px; }

/* Tab bar */
.tabbar { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); background: var(--bg); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tab { display: grid; justify-items: center; gap: 4px; padding: 10px 0 12px; color: var(--muted); }
.tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.6; }
.tab[aria-current="page"] { color: var(--fg); }
.tab[aria-current="page"] span { text-decoration: underline; text-underline-offset: 3px; }

/* Today header */
.today-head { padding: 22px 18px 18px; border-bottom: 1px solid var(--line); display: grid; gap: 14px; }
.today-head h1 { margin: 0; font-family: var(--logo); font-weight: 800; font-stretch: 100%; font-size: 34px; line-height: 1; letter-spacing: -0.02em; }
.today-head p { margin: 0; color: var(--muted); }
.timeseg { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); }
.timeseg button { padding: 10px 0; border-left: 1px solid var(--line); font-family: var(--mono); font-size: 12px; letter-spacing: 0.04em; }
.timeseg button:first-child { border-left: 0; }
.timeseg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }

/* Film card */
.film { border-bottom: 1px solid var(--line); }
.art { position: relative; display: block; width: 100%; aspect-ratio: 4 / 3; max-width: 100%; overflow: hidden; }
.art canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.art .dur { position: absolute; left: 14px; top: 12px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; padding: 3px 7px; }
.art .done-tag { position: absolute; right: 14px; top: 12px; font-family: var(--mono); font-size: 11px; padding: 3px 7px; background: #000; color: #fff; }
.film-body { padding: 14px 18px 18px; display: grid; gap: 8px; }
.film-meta { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.film h2 { margin: 0; font-size: 28px; line-height: 1.05; font-weight: 400; text-wrap: balance; }
.film p { margin: 0; color: var(--muted); }
.why { font-family: var(--mono); font-size: 11px; letter-spacing: 0.02em; color: var(--fg); }
.actions { display: flex; gap: 8px; margin-top: 6px; }
.btn { border: 1px solid var(--line); padding: 9px 14px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 8px; }
.btn.solid { background: var(--fg); color: var(--bg); }
.btn svg { width: 14px; height: 14px; fill: currentColor; }
.btn.icon { padding: 9px 11px; }
.btn.icon svg { fill: none; stroke: currentColor; stroke-width: 1.6; }
.btn.icon[aria-pressed="true"] svg { fill: currentColor; }
.end { padding: 28px 18px 36px; display: grid; gap: 8px; }
.end b { font-family: var(--logo); font-weight: 800; font-size: 22px; line-height: 1.05; }
.end span { color: var(--muted); }

/* Discipline typefaces: each discipline is its own series */
.f-Physics     { font-family: "Archivo", sans-serif; font-weight: 800; font-stretch: 125%; letter-spacing: -0.02em; font-size: 0.86em; }
.f-Mathematics { font-family: "Fraunces", Georgia, serif; font-style: italic; font-weight: 600; }
.f-Biology     { font-family: "Instrument Serif", Georgia, serif; font-size: 1.08em; }
.f-Chemistry   { font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; letter-spacing: -0.02em; }
.f-History     { font-family: "IM Fell English", Georgia, serif; font-size: 1.04em; }
.f-Acoustics   { font-family: "Unbounded", sans-serif; font-weight: 700; font-size: 0.8em; letter-spacing: -0.01em; }
.f-Ecology     { font-family: "Young Serif", Georgia, serif; }
.f-Space       { font-family: "Michroma", sans-serif; font-size: 0.74em; letter-spacing: 0.01em; }

/* Explore */
.sec-title { padding: 22px 18px 12px; display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--line); }
.sec-title h1 { margin: 0; font-family: var(--logo); font-weight: 800; font-size: 34px; line-height: 1; letter-spacing: -0.02em; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; }
.tile { aspect-ratio: 1; max-width: 100%; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; text-align: left; border-bottom: 1px solid var(--line); }
.tile:nth-child(odd) { border-right: 1px solid var(--line); }
.tile .nm { font-size: 26px; line-height: 1; overflow-wrap: anywhere; }
.backrow { padding: 12px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.disc-hero { padding: 26px 18px 22px; border-bottom: 1px solid var(--line); }
.disc-hero .nm { font-size: 46px; line-height: 0.95; overflow-wrap: anywhere; }

/* Library */
.subseg { display: flex; gap: 0; margin: 14px 18px; border: 1px solid var(--line); }
.subseg button { flex: 1; padding: 9px 0; font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
.subseg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.row { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 18px; border-bottom: 1px solid var(--hair); width: 100%; text-align: left; }
.row .thumb { position: relative; width: 64px; height: 64px; overflow: hidden; }
.row .thumb canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.row .t { font-size: 17px; line-height: 1.15; }
.pill { font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 6px; border: 1px solid currentColor; white-space: nowrap; }
.pill.ok { color: var(--good); }
.pill.no { color: var(--bad); }
.empty { padding: 30px 18px; color: var(--muted); }

/* You */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--line); }
.stat { padding: 16px 18px; border-left: 1px solid var(--line); display: grid; gap: 4px; }
.stat:first-child { border-left: 0; }
.stat b { font-family: var(--logo); font-weight: 800; font-size: 32px; line-height: 1; font-variant-numeric: tabular-nums; }
.block { padding: 20px 18px; border-bottom: 1px solid var(--line); display: grid; gap: 14px; }
.block h3 { margin: 0; font-family: var(--logo); font-weight: 800; font-size: 20px; letter-spacing: -0.01em; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); padding: 7px 12px; font-size: 17px; line-height: 1.1; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.sig { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; }
.sig .bar { grid-column: 1 / -1; height: 6px; background: var(--chip); }
.sig .bar i { display: block; height: 100%; background: var(--fg); }
.sig small { grid-column: 1 / -1; color: var(--muted); font-size: 13px; }
.linkbtn { text-decoration: underline; text-underline-offset: 3px; color: var(--muted); font-size: 13px; justify-self: start; }

/* Onboarding */
.onboard { position: absolute; inset: 0; z-index: 30; background: var(--bg); display: flex; flex-direction: column; overflow-y: auto; }
.onboard .top { padding: 22px 18px; border-bottom: 1px solid var(--line); }
.onboard .big { font-size: clamp(52px, 17vw, 76px); }
.onboard .intro { padding: 18px; display: grid; gap: 10px; border-bottom: 1px solid var(--line); }
.onboard .intro p { margin: 0; font-size: 17px; line-height: 1.35; }
.onboard .pick { padding: 18px; display: grid; gap: 12px; flex: 1; align-content: start; }
.onboard .foot { padding: 14px 18px calc(14px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.btn.lg { padding: 13px 20px; font-size: 12px; }
.btn:disabled { opacity: 0.35; cursor: default; }

/* Player: always a dark room, whatever the theme */
.player { position: absolute; inset: 0; z-index: 20; background: #0b0b0b; color: #f2f2f2; display: flex; flex-direction: column; overflow-y: auto; }
.player > *, .onboard > * { flex-shrink: 0; }
.player .bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid #2a2a2a; position: sticky; top: 0; background: #0b0b0b; z-index: 1; }
.player .x { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; border: 1px solid #f2f2f2; padding: 6px 10px; }
.stage { position: relative; width: 100%; aspect-ratio: 16 / 9; max-width: 100%; flex: none; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.stage .cap { position: absolute; left: 12px; bottom: 10px; right: 12px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; }
.stage .cap span { background: #000; color: #fff; padding: 3px 6px; }
.scrub { position: relative; height: 22px; margin: 4px 16px 0; cursor: pointer; }
.scrub .track { position: absolute; left: 0; right: 0; top: 10px; height: 2px; background: #3a3a3a; }
.scrub .fill { position: absolute; left: 0; top: 10px; height: 2px; background: #f2f2f2; }
.scrub .knob { position: absolute; top: 5px; width: 12px; height: 12px; margin-left: -6px; background: #f2f2f2; border-radius: 50%; }
.scrub .tick { position: absolute; top: 7px; width: 1px; height: 8px; background: #8a8a8a; }
.ptime { display: flex; justify-content: space-between; padding: 0 16px; font-family: var(--mono); font-size: 11px; color: #9a9a9a; font-variant-numeric: tabular-nums; }
.pctl { display: flex; align-items: center; justify-content: center; gap: 22px; padding: 12px 16px 6px; }
.pctl .round { width: 64px; height: 64px; border-radius: 50%; background: #f2f2f2; color: #0b0b0b; display: grid; place-items: center; }
.pctl .round svg { width: 24px; height: 24px; fill: currentColor; }
.pctl .skip { font-family: var(--mono); font-size: 12px; width: 48px; height: 48px; border: 1px solid #3a3a3a; border-radius: 50%; display: grid; place-items: center; }
.pctl .fast { font-family: var(--mono); font-size: 11px; padding: 6px 8px; border: 1px solid #3a3a3a; }
.pctl .fast[aria-pressed="true"] { background: #f2f2f2; color: #0b0b0b; }
.pinfo { padding: 14px 16px 8px; display: grid; gap: 8px; }
.pinfo h2 { margin: 0; font-size: 30px; line-height: 1.05; font-weight: 400; }
.pinfo p { margin: 0; color: #a5a5a5; }
.psec { padding: 14px 16px; border-top: 1px solid #2a2a2a; display: grid; gap: 8px; }
.psec .lab { color: #8a8a8a; }
.chap { width: 100%; display: grid; grid-template-columns: 52px 1fr; gap: 8px; text-align: left; padding: 8px 0; border-bottom: 1px solid #1f1f1f; color: #a5a5a5; }
.chap[aria-current="true"] { color: #fff; }
.chap .mono { color: inherit; }
.note { padding-left: 12px; border-left: 2px solid #f2f2f2; }
.note.locked { border-left-color: #3a3a3a; color: #7a7a7a; font-style: italic; }
.check { margin: 8px 16px 24px; border: 1px solid #f2f2f2; padding: 16px; display: grid; gap: 12px; }
.check h3 { margin: 0; font-size: 20px; line-height: 1.2; font-weight: 500; }
.opt { text-align: left; border: 1px solid #3a3a3a; padding: 12px; }
.opt:hover:not(:disabled) { border-color: #f2f2f2; }
.opt.right { border-color: #4fd08a; color: #4fd08a; }
.opt.wrong { border-color: #ff7766; color: #ff7766; }
.opt:disabled { cursor: default; }
.check .btn { border-color: #f2f2f2; }
.check .btn.solid { background: #f2f2f2; color: #0b0b0b; }

@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body style="margin:0">

<div class="desk">
  <div class="aside">
    <div class="logo">Brain<br>fart</div>
    <p>Five, ten, or fifteen minutes on one idea worth knowing. A daily program that ends, ranked by what you understood.</p>
    <span class="mono" style="color:var(--muted)">Prototype · sample program</span>
  </div>

  <div class="device" id="device">
    <header class="appbar">
      <span class="logo">Brainfart</span>
      <div class="right"><span class="mono" id="datebadge"></span></div>
    </header>
    <main class="screen" id="screen"></main>
    <nav class="tabbar" id="tabbar" aria-label="App">
      <button class="tab" data-tab="today" type="button">
        <svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="16"/><path d="M3.5 9.5h17M8 2.5v4M16 2.5v4"/></svg><span class="mono">Today</span></button>
      <button class="tab" data-tab="explore" type="button">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg><span class="mono">Explore</span></button>
      <button class="tab" data-tab="library" type="button">
        <svg viewBox="0 0 24 24"><path d="M5 3.5h4v17H5zM10.5 3.5h4v17h-4zM16 4.5l3.6-.9 3 16.5-3.6.9z"/></svg><span class="mono">Library</span></button>
      <button class="tab" data-tab="you" type="button">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="4"/><path d="M4 20.5c1.4-4 4.4-6 8-6s6.6 2 8 6"/></svg><span class="mono">You</span></button>
    </nav>

    <section class="player" id="player" role="dialog" aria-modal="true" aria-labelledby="p-title" hidden></section>
    <section class="onboard" id="onboard" aria-labelledby="ob-title" hidden></section>
  </div>
</div>

<script>
(function () {
  "use strict";

  // Each discipline is a series: its own typeface (see .f-* classes) and its own color field.
  var DISC = {
    Physics:     { bg: "#2b3bff", ink: "#ffffff", style: "waves" },
    Mathematics: { bg: "#ffd60a", ink: "#000000", style: "grid" },
    Biology:     { bg: "#0f9d63", ink: "#000000", style: "network" },
    Chemistry:   { bg: "#ff8fb1", ink: "#000000", style: "network" },
    History:     { bg: "#c9b79c", ink: "#000000", style: "orbits" },
    Acoustics:   { bg: "#ff4f1f", ink: "#000000", style: "waves" },
    Ecology:     { bg: "#0b4d3a", ink: "#ffffff", style: "orbits" },
    Space:       { bg: "#000000", ink: "#ffffff", style: "orbits" }
  };
  var DISCIPLINES = Object.keys(DISC);

  var FILMS = [
    { id: "sky", d: "Physics", m: 5, title: "Why the sky isn't violet",
      dek: "Air scatters short wavelengths more than long ones. Violet is shorter than blue, so why isn't the sky violet?",
      ch: [[0, "Rayleigh scattering", "Scattering strength rises steeply as wavelength shortens, roughly as 1/λ⁴."],
           [90, "The violet problem", "Sunlight carries less violet than blue, and some violet is absorbed high in the atmosphere."],
           [180, "Your eyes vote", "Our cones respond weakly to violet, so the mix reads as sky blue."],
           [255, "Sunsets", "With the sun low, light crosses more air. The blues scatter away and the reds reach you."]],
      q: "Which of these does NOT help explain why the sky looks blue rather than violet?",
      o: ["The sun emits less violet than blue", "Human cones are less sensitive to violet", "Violet light scatters less than blue"], a: 2,
      ex: "Violet actually scatters more than blue. The source spectrum and our eyes do the rest.", builds: [] },
    { id: "reverb", d: "Acoustics", m: 5, title: "The sound of a room",
      dek: "Why a cathedral blurs speech and a recording booth sounds dead.",
      ch: [[0, "Reflections", "Sound bounces off every surface. Reverberation is the decaying sum of those reflections."],
           [100, "RT60", "Engineers measure how long a sound takes to fall by 60 decibels. That number is RT60."],
           [200, "Built for purpose", "Concert halls aim for about 2 seconds. Lecture rooms stay under 1 so speech stays clear."]],
      q: "RT60 is the time it takes a sound to decay by:", o: ["6 dB", "60 dB", "Half its loudness"], a: 1,
      ex: "Sixty decibels, a drop to one millionth of the original sound energy.", builds: ["sky"] },
    { id: "bread", d: "Chemistry", m: 5, title: "Why bread rises",
      dek: "Yeast makes the gas. Gluten holds it. Heat locks it in.",
      ch: [[0, "Fermentation", "Yeast, a fungus, eats sugars and releases carbon dioxide and ethanol."],
           [100, "The gluten net", "Kneading links glutenin and gliadin into an elastic network that traps the gas."],
           [200, "Oven spring", "In the oven, trapped gas and steam expand fast until the crumb sets."]],
      q: "What traps the gas inside dough?", o: ["Starch granules", "The gluten network", "Salt"], a: 1,
      ex: "Gluten's stretchy protein network holds the bubbles while the dough rises.", builds: ["fungi"] },
    { id: "antikythera", d: "History", m: 10, title: "The Antikythera mechanism",
      dek: "A shoebox of bronze gears from around 100 BCE that predicted eclipses.",
      ch: [[0, "The wreck, 1901", "Sponge divers recovered corroded bronze fragments from a Roman-era shipwreck off Antikythera."],
           [150, "Seeing inside", "X-ray CT scans in the 2000s revealed gear trains and thousands of inscribed characters."],
           [330, "What it computed", "It modeled lunar phases, the Saros eclipse cycle, and likely the planets."],
           [480, "Why it matters", "Nothing of comparable mechanical complexity survives from the next thousand years."]],
      q: "What revealed the mechanism's hidden gearing?", o: ["Taking the fragments apart", "X-ray computed tomography", "An ancient manual describing it"], a: 1,
      ex: "CT scanning let researchers read gears and text sealed inside the corrosion.", builds: ["voyager"] },
    { id: "bayes", d: "Mathematics", m: 10, title: "Bayes' rule with a deck of cards",
      dek: "Update a belief by exactly as much as the evidence deserves.",
      ch: [[0, "Prior", "Before you look, a card is a king with probability 4 in 52."],
           [150, "Evidence", "Learn that it's a face card and the space shrinks: 4 kings out of 12 face cards."],
           [330, "The rule", "Posterior equals prior times the likelihood of the evidence, normalized."],
           [480, "Medical tests", "A 99% accurate test for a rare condition can still produce mostly false positives."]],
      q: "You learn the card is a face card. What's the chance it's a king?", o: ["4 in 52", "1 in 3", "1 in 4"], a: 1,
      ex: "Four kings among twelve face cards: 4/12, or 1 in 3.", builds: [] },
    { id: "godel", d: "Mathematics", m: 10, title: "Gödel's incompleteness, plainly",
      dek: "Any consistent system strong enough for arithmetic contains true statements it can't prove.",
      ch: [[0, "Hilbert's dream", "In the 1920s Hilbert hoped to ground all of mathematics in one complete, consistent set of axioms."],
           [150, "Numbers about proofs", "Gödel encoded statements as numbers, so arithmetic could describe its own proofs."],

    refs.scrub = h("div", { class: "scrub", role: "slider", tabindex: "0", "aria-label": "Seek", "aria-valuemin": "0", "aria-valuemax": String(dur), "aria-valuenow": "0" }, h("div", { class: "track" }), refs.fill);
    f.ch.forEach(function (x) { if (x[0]) refs.scrub.appendChild(h("div", { class: "tick", style: "left:" + (x[0] / dur * 100) + "%" })); });
    refs.scrub.appendChild(refs.knob);
    refs.scrub.addEventListener("click", function (e) { var r = this.getBoundingClientRect(); seek((e.clientX - r.left) / r.width * dur); });

    refs.fast = h("button", { class: "fast", type: "button", "aria-pressed": String(P.fast), title: "Preview the whole film quickly", text: "30×", on: function () { P.fast = !P.fast; this.setAttribute("aria-pressed", String(P.fast)); } });
    refs.chapters = h("div");
    refs.notes = h("div", { style: "display:grid;gap:10px" });
    refs.check = h("div", { class: "check", hidden: "" });
    f.ch.forEach(function (x) { refs.chapters.appendChild(h("button", { class: "chap", type: "button", on: function () { seek(x[0]); } }, h("span", { class: "mono", text: fmt(x[0]) }), h("span", { text: x[1] }))); });

    player.appendChild(h("div", { class: "bar" },
      h("span", { class: "mono", style: "color:#9a9a9a", text: f.d + " · " + f.m + " min" }),
      h("button", { class: "x", type: "button", text: "Close", on: closePlayer })));
    player.appendChild(h("div", { class: "stage" }, refs.canvas, h("div", { class: "cap" }, refs.cap)));
    player.appendChild(refs.scrub);
    player.appendChild(h("div", { class: "ptime" }, refs.cur, refs.left));
    player.appendChild(h("div", { class: "pctl" },
      h("button", { class: "skip", type: "button", "aria-label": "Back 15 seconds", text: "−15", on: function () { seek(P.t - 15); } }),
      refs.play,
      h("button", { class: "skip", type: "button", "aria-label": "Forward 15 seconds", text: "+15", on: function () { seek(P.t + 15); } }),
      refs.fast));
    player.appendChild(h("div", { class: "pinfo" }, h("h2", { class: "f-" + f.d, id: "p-title", text: f.title }), h("p", { text: f.dek })));
    player.appendChild(refs.check);
    player.appendChild(h("div", { class: "psec" }, h("span", { class: "mono lab", text: "Chapters" }), refs.chapters));
    player.appendChild(h("div", { class: "psec" }, h("span", { class: "mono lab", text: "Notes so far" }), refs.notes));
    player.appendChild(h("div", { class: "psec", style: "padding-bottom:28px" }, h("button", { class: "btn", type: "button", style: "border-color:#f2f2f2;justify-self:start", text: "Skip to the question", on: function () { P.playing = false; showCheck(); } })));

    refs.play.focus();

  }
  function closePlayer() { P.playing = false; cancelAnimationFrame(P.raf); player.hidden = true; render(); }

  var lastCi = -1;

    var f = P.f, dur = f.m * 60, p = P.t / dur, ci = curChapter();
    paintArt(refs.canvas, f, p, P.t * 0.6);
    refs.fill.style.width = (p * 100) + "%"; refs.knob.style.left = (p * 100) + "%";
    refs.scrub.setAttribute("aria-valuenow", String(Math.round(P.t)));
    refs.cur.textContent = fmt(P.t); refs.left.textContent = "−" + fmt(dur - P.t);

      [].forEach.call(refs.chapters.children, function (b, i) { b.setAttribute("aria-current", String(i === ci)); });
      refs.notes.textContent = "";

        if (i <= ci) refs.notes.appendChild(h("div", { class: "note", text: x[2] }));

  }

  function showCheck() {
    if (P.checkOpen) return;
    P.checkOpen = true;
    var f = P.f, box = refs.check; box.textContent = ""; box.hidden = false;
    box.appendChild(h("span", { class: "mono", style: "color:#9a9a9a", text: "One question · this is how your program learns" }));
    box.appendChild(h("h3", { text: f.q }));
    var opts = h("div", { style: "display:grid;gap:8px" });

    box.appendChild(opts);

  }
  function answer(i) {
    var f = P.f, ok = i === f.a, box = refs.check;
    if (P.answered) return; P.answered = true;
    [].forEach.call(box.querySelectorAll(".opt"), function (b, k) { b.disabled = true; if (k === f.a) b.classList.add("right"); else if (k === i) b.classList.add("wrong"); });
    state.done[f.id] = { correct: ok, at: Date.now() }; save();
    var next = FILMS.filter(function (g) { return g.builds.indexOf(f.id) >= 0; })[0];
    box.appendChild(h("p", { style: "margin:0" },
      h("b", { style: "color:" + (ok ? "#4fd08a" : "#ff7766"), text: ok ? "Right. " : "Not quite. " }),
      f.ex + (ok && next ? " “" + next.title + "” moves up your program." : ok ? "" : " It'll come back for review in a few days.")));
    box.appendChild(h("div", { class: "actions" },
      h("button", { class: "btn solid", type: "button", text: "Go deeper", on: function () { if (state.interests.indexOf(f.d) < 0) state.interests.push(f.d); save(); closePlayer(); } }),
      h("button", { class: "btn", type: "button", text: "Done", on: closePlayer })));
  }

  document.addEventListener("keydown", function (e) {
    if (player.hidden) return;
    if (e.key === "Escape") closePlayer();
    if (e.key === " " && (e.target === document.body || e.target === refs.scrub)) { e.preventDefault(); togglePlay(); }
  });

  var rt; window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(paintAll, 120); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(paintAll);

  render();
})();
