<title>Partanna Pullman Loaf</title>

<style>
/*__FONTS__*/

  /* --- Partanna Pullman Loaf ------------------------------------------
     A packaging concept: the Partanna bag's branding and palette on a
     wide bread pouch. Fully printed - the loaf is inside, not shown.
     Single visual world; every colour painted explicitly. */
  :root{
    --red-lit:    #E23A3C;
    --red:        #C8161F;
    --red-deep:   #96101A;
    --red-shadow: #6B0910;
    --gold:       #F0CE72;
    --gold-mid:   #C89A2E;
    --cream:      #F8F1E0;
    --cream-dim:  #E7D9BA;
    --ground:     #E7E1D5;
  }

  html{ color-scheme: light; }
  body{
    margin:0; padding:24px; box-sizing:border-box; min-height:100vh;
    background: var(--ground);
    color: var(--cream);
    font-family:"Italian Plate No1 Expanded","Helvetica Neue",Arial,sans-serif;
    display:flex; align-items:center; justify-content:center;
  }
  .viewport{ display:flex; align-items:center; justify-content:center; }
  .stage{
    width:1080px; height:1080px; flex:none; position:relative; overflow:hidden;
    transform: scale(var(--fit,1)); transform-origin:center center;
    background:
      radial-gradient(115% 80% at 50% 14%, #F4F0E7 0%, rgba(244,240,231,0) 64%),
      var(--ground);
  }

  .shadow{
    position:absolute; left:50%; translate:-50% 0; bottom:212px;
    width:920px; height:52px; border-radius:50%;
    background: radial-gradient(50% 50%, rgba(60,40,30,.40), rgba(60,40,30,0) 72%);
    filter: blur(7px);
  }

  .bag{
    position:absolute; left:50%; top:50%; translate:-50% -50%;
    width:948px; height:624px;
    filter: drop-shadow(0 16px 26px rgba(70,30,20,.26));
  }

  /* ---- crimped top seal ---------------------------------------------- */
  .crimp{
    position:absolute; left:16px; right:16px; top:0; height:66px;
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.22) 0 3px, rgba(255,255,255,.09) 3px 10px),
      linear-gradient(90deg, #400407 0%, #7B0C13 7%, #C4161F 22%, #D93034 40%,
                      var(--red) 58%, #8E1018 85%, #400407 100%);
    clip-path: polygon(0 18%, 6% 8%, 17% 14%, 29% 6%, 42% 13%, 55% 5%, 68% 12%,
                       80% 6%, 92% 13%, 100% 7%, 100% 100%, 0 100%);
    border-radius:4px 4px 0 0;
  }
  .crimp::after{
    content:""; position:absolute; left:0; right:0; bottom:0; height:14px;
    background: linear-gradient(180deg, rgba(0,0,0,.32), rgba(0,0,0,0));
  }

  /* ---- bag body -------------------------------------------------------- */
  .bagbody{
    position:absolute; left:0; right:0; top:58px; bottom:0;
    border-radius:26px 26px 22px 22px;
    background:
      linear-gradient(180deg, rgba(0,0,0,.20) 0, rgba(0,0,0,0) 11%,
                      rgba(0,0,0,0) 84%, rgba(0,0,0,.24) 100%),
      linear-gradient(90deg, #470508 0%, #7B0C13 3%, #A81119 8%, #CE1F27 16%,
                      var(--red-lit) 29%, #E9494B 37%, var(--red-lit) 45%,
                      var(--red) 60%, #A81119 85%, #740A11 94%, #440507 100%);
    overflow:hidden;
  }
  .bagbody::before{                         /* film catches the light in bands */
    content:""; position:absolute; inset:0; pointer-events:none; z-index:1;
    background:
      linear-gradient(104deg, rgba(255,255,255,0) 26%, rgba(255,255,255,.10) 33%,
                      rgba(255,255,255,0) 39%),
      linear-gradient(97deg,  rgba(0,0,0,0) 60%, rgba(0,0,0,.10) 67%, rgba(0,0,0,0) 74%),
      linear-gradient(180deg, rgba(255,255,255,.07) 0 3%, rgba(255,255,255,0) 9%);
  }
  .bagbody::after{                          /* the foot the bag stands on */
    content:""; position:absolute; left:0; right:0; bottom:0; height:64px;
    background:
      radial-gradient(120% 100% at 50% 100%, rgba(0,0,0,.32), rgba(0,0,0,0) 72%),
      linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,.38));
    border-top:1px solid rgba(0,0,0,.22);
  }

  .wheat{ position:absolute; width:126px; bottom:16px; opacity:1; }
  .wheat.l{ left:6px;   rotate:-6deg; }
  .wheat.r{ right:6px;  rotate:6deg; scale:-1 1; }

  /* ---- printed front panel --------------------------------------------- */
  .panel{
    position:absolute; left:152px; right:152px; top:22px; bottom:30px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:14px 18px 12px;
    border:2px solid var(--gold);
    border-radius:10px;
    box-shadow: inset 0 0 0 3px rgba(0,0,0,.26), inset 0 0 0 5px var(--gold-mid);
  }

  .since{
    display:flex; align-items:center; gap:11px;
    font-weight:600; font-size:12px; letter-spacing:.34em; text-indent:.34em;
    color:var(--gold); text-transform:uppercase;
  }
  .since i{ width:30px; height:1px; background:var(--gold-mid); }

  .partanna{ width:524px; height:auto; display:block; margin:8px 0 0; }

  .brandword{
    margin-top:5px;
    font-weight:600; font-size:12px; letter-spacing:.60em; text-indent:.60em;
    color:var(--gold); text-transform:uppercase;
  }
  .rule{ width:66%; height:2px; margin-top:12px;
         background:linear-gradient(90deg, transparent, var(--gold-mid) 20%,
                                    var(--gold) 50%, var(--gold-mid) 80%, transparent); }

  .flag{
    width:36px; height:24px; border-radius:3px; margin-top:14px; flex:none;
    box-shadow: 0 0 0 2px var(--gold-mid), 0 1px 3px rgba(0,0,0,.35);
    background: linear-gradient(90deg, #1B7A3E 0 33.34%, #F4F1E8 33.34% 66.67%, #C8202C 66.67% 100%);
  }

  /* ---- product name ----------------------------------------------------- */
  .cartouche{
    width:86%; margin-top:14px; padding:11px 0 12px;
    text-align:center; border-radius:8px;
    border:2px solid var(--gold);
    background: linear-gradient(180deg, var(--red-deep), var(--red-shadow));
    box-shadow: inset 0 0 0 2px rgba(0,0,0,.28), 0 2px 0 rgba(0,0,0,.20);
  }
  .cartouche .name{
    font-family:"Bodoni Moda","Didot",Georgia,serif;
    font-weight:700; font-size:43px; line-height:1;
    letter-spacing:.09em; text-indent:.09em; color:#FFF8E9;
  }
  .cartouche .kind{
    margin-top:6px;
    font-weight:500; font-size:13px; letter-spacing:.30em; text-indent:.30em;
    color:var(--cream-dim); text-transform:uppercase;
  }

  /* ---- specifications ---------------------------------------------------- */
  .specs{
    display:flex; flex-direction:column; align-items:center; gap:8px;
    margin-top:18px;
    font-weight:500; font-size:15px; letter-spacing:.13em;
    color:var(--cream); text-transform:uppercase;
  }
  .specs .row{ display:flex; align-items:center; justify-content:center; gap:14px; }
  .specs .row span{ text-indent:.13em; }
  .specs .row i{ width:6px; height:6px; flex:none; rotate:45deg; background:var(--gold); }

  .netwt{
    margin-top:10px;
    font-weight:500; font-size:12.5px; letter-spacing:.16em; text-indent:.16em;
    color:var(--cream-dim); text-transform:uppercase;
  }

  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
</style>

<div class="viewport">
  <div class="stage" id="stage">
    <div class="shadow"></div>

    <div class="bag">
      <div class="crimp"></div>
      <div class="bagbody">
        __WHEAT_L__
        __WHEAT_R__

        <div class="panel">
          <div class="since"><i></i><span>Since 1916</span><i></i></div>
          __PARTANNA__
          <div class="brandword">Brand</div>
          <div class="rule"></div>
          <span class="flag"></span>

          <div class="cartouche">
            <div class="name">PULLMAN LOAF</div>
            <div class="kind">Artisanal Bread</div>
          </div>

          <div class="specs">
            <div class="row"><span>100% Italian semolina</span><i></i><span>Naturally leavened</span></div>
            <div class="row"><span>Shaped by hand</span><i></i><span>Baked fresh daily</span></div>
          </div>
          <div class="netwt">Net wt 24 oz (680 g)</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const EXPORT = location.search.includes('export');
  if (EXPORT) {
    document.body.style.cssText += ';padding:0;display:block;width:1080px;height:1080px;overflow:hidden';
  }
  function fit(){
    const pad = EXPORT ? 0 : 48;
    const s = EXPORT ? 1 : Math.min((innerWidth - pad) / 1080, (innerHeight - pad) / 1080, 1);
    document.documentElement.style.setProperty('--fit', s);
    const v = document.querySelector('.viewport');
    v.style.width  = (1080 * s) + 'px';
    v.style.height = (1080 * s) + 'px';
  }
  addEventListener('resize', fit); fit();
</script>
