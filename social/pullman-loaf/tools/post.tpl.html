<title>__TITLE__</title>

<style>
/*__FONTS__*/

  /* --- F&F Pizzeria / the Pullman loaf --------------------------------
     A two-colour letterpress job: press black + F&F navy on newsprint.
     Deliberately single-theme -- every colour is painted explicitly so
     the sheet holds on any host ground. */
  :root{
/*__PALETTE__*/
    --ground: #2A2621;       /* the table the sheet lies on */
  }

  html{ color-scheme: light; }
  body{
    margin:0; padding:24px; box-sizing:border-box;
    min-height:100vh;
    background: var(--ground);
    color: var(--ink);
    font-family:"Libre Baskerville", Georgia, serif;
    display:flex; align-items:center; justify-content:center;
  }
  .viewport{ display:flex; align-items:center; justify-content:center; }

  .stage{
    width:1080px; height:1350px; flex:none;
    position:relative; overflow:hidden;
    background: var(--paper);
    transform: scale(var(--fit,1)); transform-origin:center center;
    box-shadow: 0 26px 70px rgba(0,0,0,.55);
  }

  /* ---- the sheet ---------------------------------------------------- */
  .paper{ position:absolute; inset:0; }
  .paper::before{                          /* uneven pulp, not flat cream */
    content:""; position:absolute; inset:0;
    background:
      radial-gradient(120% 90% at 20% 6%,  var(--paper-hi) 0%, var(--paper-hi-0) 55%),
      radial-gradient(100% 80% at 90% 97%, var(--paper-lo) 0%, var(--paper-lo-0) 62%);
  }
  .fibres{                                 /* laid-paper direction */
    position:absolute; inset:0; pointer-events:none; opacity:.032;
    background: repeating-linear-gradient(96deg, var(--ink) 0 1px, transparent 1px 6px);
  }
  .grain{
    position:absolute; inset:0; pointer-events:none;
    mix-blend-mode:multiply; opacity:.16;
  }

  /* ---- the ad box ---------------------------------------------------- */
  .rulebox{
    position:absolute; inset:30px; overflow:hidden;   /* the loaf bleeds to the rule */
    border:9px solid var(--ink);
    box-shadow: inset 0 0 0 5px var(--paper), inset 0 0 0 7px var(--ink);
    padding:34px 50px 30px;
    display:flex; flex-direction:column;
  }

  /* ---- dateline ------------------------------------------------------ */
  .eyebrow{
    flex:none;
    display:flex; align-items:center; justify-content:center; gap:16px;
    font-family:"Oswald","Arial Narrow",sans-serif;
    font-weight:500; font-size:19px; letter-spacing:.30em;
    text-transform:uppercase;
    padding-bottom:10px; border-bottom:2px solid var(--ink);
  }
  .eyebrow .lozenge{ width:8px; height:8px; flex:none; rotate:45deg; background:var(--brand); }

  /* ---- headline stack ------------------------------------------------ */
  .hero{ flex:none; text-align:center; padding-top:10px;
         padding-bottom:6px; }
  .hero .kicker{
    font-family:"Oswald","Arial Narrow",sans-serif;
    font-weight:600; font-size:38px; line-height:1;
    letter-spacing:.30em; text-indent:.30em;   /* indent re-centres the tracking */
    text-transform:uppercase;
  }
  .hero .since{
    position:relative; margin:8px 0 -12px;
    font-family:"Pinyon Script","Snell Roundhand",cursive;
    font-size:110px; line-height:.76; color:var(--brand);
  }
  .hero .since::before{                       /* navy plate, slipped on press */
    content:"Better"; position:absolute; inset:0; z-index:-1;
    color:var(--ghost); translate:-3px 2.5px;
  }
  .hero .shout{
    font-family:"Ultra","Rockwell",Georgia,serif;
    font-size:89px; line-height:.94; letter-spacing:-.018em;
    text-shadow:0 0 1.2px var(--ink);          /* ink squeeze off the plate */
  }

  /* ---- product ------------------------------------------------------- */
  .plate{
    flex:1 1 auto; min-height:0; position:relative;
    margin-top:24px;
  }
  .loaf{
    position:absolute; inset:0;
    -webkit-mask-image:var(--loaf);       mask-image:var(--loaf);
    -webkit-mask-size:contain;            mask-size:contain;
    -webkit-mask-repeat:no-repeat;        mask-repeat:no-repeat;
    -webkit-mask-position:center bottom;  mask-position:center bottom;
    background:var(--loaf-ink);
  }
  .burst{                                     /* period oval, set on the angle */
    position:absolute; left:0; top:14px; z-index:2;
    width:184px; height:118px; rotate:-11deg;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    border:3px solid var(--ink); border-radius:50%;
    box-shadow: inset 0 0 0 3px var(--paper), inset 0 0 0 5px var(--ink);
    background:var(--paper);
    font-family:"Oswald","Arial Narrow",sans-serif;
    text-transform:uppercase; text-align:center; line-height:1;
  }
  .burst .b1{ font-weight:700; font-size:27px; letter-spacing:.09em; }
  .burst .b2{ font-weight:500; font-size:15px; letter-spacing:.20em; color:var(--brand); }
  .burst .tick{ width:44px; border-top:2px solid var(--ink); margin:5px 0 4px; }

  /* ---- specification panel ------------------------------------------- */
  .specs{
    flex:none; display:flex; flex-direction:column; align-items:center; gap:11px;
    margin-top:18px; padding-bottom:6px;
    font-family:"Oswald","Arial Narrow",sans-serif;
    font-weight:500; font-size:23px; letter-spacing:.22em;
    text-transform:uppercase; color:var(--ink);
  }
  .specs .row{ display:flex; align-items:center; justify-content:center; gap:20px; }
  .specs .row span{ text-indent:.22em; }     /* indent offsets the trailing track */
  .specs .row i{ width:8px; height:8px; flex:none; rotate:45deg; background:var(--brand); }

  /* ---- reversed product slab ----------------------------------------- */
  .slab{
    flex:none; position:relative; margin-top:14px;
    background:var(--brand); color:var(--paper);
    font-family:"Oswald","Arial Narrow",sans-serif;
    font-weight:600; font-size:35px; letter-spacing:.30em; text-indent:.30em;
    text-transform:uppercase; text-align:center;
    padding:12px 0 15px;
  }
  .slab::after{                                /* second plate, a hair low */
    content:""; position:absolute; left:0; right:0; bottom:-3px; height:3px;
    background:var(--plate2);
  }

  /* ---- signature ------------------------------------------------------ */
  .sig{
    flex:none; display:flex; align-items:center; gap:22px;
    margin-top:auto; padding-top:16px; border-top:2px solid var(--ink);
  }
  .badge{
    width:86px; height:86px; flex:none; border-radius:50%;
    background:var(--paper-hi); box-shadow: inset 0 0 0 3px var(--ink);
    display:flex; align-items:center; justify-content:center;
  }
  .badge svg{ width:64px; height:auto; display:block; color:var(--brand); }
  .sig .name{
    font-family:"Oswald","Arial Narrow",sans-serif;
    font-weight:600; font-size:29px; letter-spacing:.20em;
    text-transform:uppercase; line-height:1;
  }
  .sig .handle{
    margin-left:auto;
    font-family:"Oswald","Arial Narrow",sans-serif;
    font-weight:600; font-size:25px; letter-spacing:.18em;
    text-transform:uppercase; color:var(--brand);
  }

  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
</style>

<div class="viewport">
  <div class="stage" id="stage">
    <div class="paper"></div>

    <div class="rulebox">

      <div class="eyebrow">
        <span>F &amp; F Pizzeria</span>
        <span class="lozenge"></span>
        <span>Mount Lebanon, Pennsylvania</span>
      </div>

      <div class="hero">
        <div class="kicker">The</div>
        <div class="since">Better</div>
        <div class="shout">WHITE BREAD</div>
      </div>

      <div class="plate">
        <div class="loaf"></div>
        <div class="burst">
          <span class="b1">Baked</span>
          <span class="tick"></span>
          <span class="b2">In House</span>
        </div>
      </div>

      <div class="specs">
        <div class="row"><span>100% Italian semolina</span><i></i><span>Naturally leavened</span></div>
        <div class="row"><span>Shaped by hand</span><i></i><span>Baked fresh daily</span></div>
      </div>

      <div class="slab">The Pullman Loaf</div>

      <div class="sig">
        <div class="badge">
          <svg viewBox="0 27.5 180 125" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="F and F">
            __MARKINNER__
          </svg>
        </div>
        <div class="name">F &amp; F Pizzeria</div>
        <div class="handle">@fandfpgh</div>
      </div>

    </div>

    <div class="fibres"></div>
    <svg class="grain" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <filter id="pulp"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/></filter>
      <rect width="100%" height="100%" filter="url(#pulp)"/>
    </svg>
  </div>
</div>

<script>
  document.getElementById('stage').style.setProperty('--loaf', 'url("__LOAF__")');

  const EXPORT = location.search.includes('export');
  if (EXPORT) {
    document.body.style.cssText += ';padding:0;display:block;width:1080px;height:1350px;overflow:hidden';
    document.querySelector('.stage').style.boxShadow = 'none';
  }
  function fit(){
    const pad = EXPORT ? 0 : 48;
    const s = EXPORT ? 1 : Math.min((innerWidth - pad) / 1080, (innerHeight - pad) / 1350, 1);
    document.documentElement.style.setProperty('--fit', s);
    const v = document.querySelector('.viewport');
    v.style.width  = (1080 * s) + 'px';
    v.style.height = (1350 * s) + 'px';
  }
  addEventListener('resize', fit); fit();
</script>
